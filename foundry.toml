[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.36"
optimizer = true
optimizer_runs = 1_000_000
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[lint]
exclude_lints = ["mixed-case-variable", "mixed-case-function"]
